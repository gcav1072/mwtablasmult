<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tablas de Multiplicar — Repetición Espaciada</title>
  <meta name="description"
    content="Practica las tablas de multiplicar con repetición espaciada. App educativa para niños de 9-11 años.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap"
    rel="stylesheet">
  <script>
    // Aplica el tema guardado antes de pintar para evitar el parpadeo (FOUC)
    (function () {
      try {
        var prefs = JSON.parse(localStorage.getItem('tablas_prefs_v1') || '{}');
        var pref = prefs.tema || 'system';
        var claro = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
        var tema = pref === 'system' ? (claro ? 'light' : 'dark') : pref;
        document.documentElement.dataset.theme = tema;
        document.documentElement.style.colorScheme = tema;
      } catch (e) { /* sin preferencias guardadas */ }
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <main id="app">

    <!-- ═══════════════ PANTALLA: PERFILES ═══════════════ -->
    <section id="pantalla-perfiles" class="pantalla">
      <div class="contenedor">
        <h1>¡Vamos a aprendernos las tablas de multiplicar!</h1>
        <p class="subtitulo">Elige tu perfil para empezar:</p>
        <div id="lista-perfiles"></div>
        <div class="nuevo-perfil">
          <button id="btn-mostrar-nuevo" class="btn-nuevo-perfil" aria-label="Crear nuevo perfil">
            <span class="icono-mas">+</span>
            <span>Nuevo perfil</span>
          </button>
          <button id="btn-importar-perfiles" class="btn-importar-perfil" aria-label="Importar un perfil desde un archivo">
            <span>📤 Importar perfil</span>
          </button>
          <input type="file" id="input-importar" accept=".json" hidden
            aria-label="Seleccionar archivo de perfil para importar">
          <div id="input-nuevo-perfil" class="nuevo-perfil-form" hidden>
            <div class="input-nuevo">
              <input type="text" id="nombre-nuevo-perfil" placeholder="Escribe tu nombre..." maxlength="20"
                autocomplete="off" aria-label="Nombre del nuevo perfil">
              <button id="btn-crear-perfil" class="btn-confirmar" aria-label="Crear perfil">✓</button>
              <button id="btn-cancelar-nuevo" class="btn-cancelar" aria-label="Cancelar">✗</button>
            </div>
            <div class="ritmo-bloque">
              <p id="ritmo-titulo" class="ritmo-titulo"></p>
              <div id="ritmo-selector" class="ritmo-selector" role="radiogroup" aria-label="Ritmo de estudio"></div>
              <p id="ritmo-nota" class="ritmo-nota"></p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ═══════════════ PANTALLA: INICIO ═══════════════ -->
    <section id="pantalla-inicio" class="pantalla" hidden>
      <div class="contenedor">
        <h1 id="saludo"></h1>
        <div id="resumen-rapido" class="stats-cards"></div>
        <div class="botones-inicio">
          <button id="btn-empezar" class="btn-principal" aria-label="Empezar sesión">▶ Empezar sesión</button>
          <div class="botones-secundarios">
            <button id="btn-progreso" class="btn-secundario" aria-label="Ver mi progreso">📊 Mi progreso</button>
            <button id="btn-cambiar-perfil" class="btn-secundario" aria-label="Cambiar de perfil">🔧 Cambiar perfil</button>
          </div>
        </div>
        <div id="aviso-tablas-extendidas" class="aviso-desbloqueo" hidden></div>
      </div>
    </section>

    <!-- ═══════════════ PANTALLA: PRÁCTICA ═══════════════ -->
    <section id="pantalla-practica" class="pantalla" hidden>
      <div class="contenedor practica-layout">
        <div class="barra-superior">
          <div class="progreso-barra">
            <div id="progreso-fill" class="progreso-fill"></div>
          </div>
          <span id="progreso-texto" class="progreso-texto"></span>
          <div id="racha-display" class="racha" hidden>
            <span class="racha-fuego">🔥</span>
            <span id="racha-numero">0</span>
          </div>
        </div>

        <div id="zona-pregunta" class="zona-pregunta glass">
          <div id="reto-badge" class="reto-badge" hidden>🎓 Reto</div>
          <div id="pregunta-texto" class="pregunta"></div>
        </div>

        <div class="zona-input">
          <div id="input-respuesta" class="input-display glass" role="textbox" aria-label="Tu respuesta">
            <span id="respuesta-valor"></span>
            <span id="cursor" class="cursor-parpadeo">|</span>
          </div>
        </div>

        <div class="teclado" role="group" aria-label="Teclado numérico">
          <button class="tecla" data-tecla="1" aria-label="1">1</button>
          <button class="tecla" data-tecla="2" aria-label="2">2</button>
          <button class="tecla" data-tecla="3" aria-label="3">3</button>
          <button class="tecla" data-tecla="4" aria-label="4">4</button>
          <button class="tecla" data-tecla="5" aria-label="5">5</button>
          <button class="tecla" data-tecla="6" aria-label="6">6</button>
          <button class="tecla" data-tecla="7" aria-label="7">7</button>
          <button class="tecla" data-tecla="8" aria-label="8">8</button>
          <button class="tecla" data-tecla="9" aria-label="9">9</button>
          <button class="tecla tecla-borrar" data-tecla="borrar" aria-label="Borrar último dígito">⌫</button>
          <button class="tecla" data-tecla="0" aria-label="0">0</button>
          <button class="tecla tecla-confirmar" data-tecla="confirmar" aria-label="Confirmar respuesta">✓</button>
        </div>
      </div>
    </section>

    <!-- ═══════════════ PANTALLA: RESUMEN ═══════════════ -->
    <section id="pantalla-resumen" class="pantalla" hidden>
      <div class="contenedor">
        <h2>📝 Resumen de la sesión</h2>
        <div id="resumen-circulo" class="resumen-circulo">
          <svg width="140" height="140" viewBox="0 0 140 140">
            <defs>
              <linearGradient id="grad-circulo" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#8b5cf6" />
                <stop offset="100%" style="stop-color:#3b82f6" />
              </linearGradient>
            </defs>
            <circle class="circulo-track" cx="70" cy="70" r="58" />
            <circle id="circulo-prog" class="circulo-progreso" cx="70" cy="70" r="58" stroke-dasharray="364.42"
              stroke-dashoffset="364.42" transform="rotate(-90 70 70)" />
            <text id="circulo-texto" class="circulo-texto" x="70" y="70">0%</text>
          </svg>
        </div>
        <div id="resumen-stats" class="resumen-stats"></div>
        <div id="resumen-fallados" class="resumen-fallados"></div>
        <div id="resumen-medallas" class="resumen-medallas" hidden></div>
        <p id="resumen-mensaje" class="mensaje-motivador"></p>
        <div id="resumen-desbloqueo"></div>
        <div id="extra-resumen" class="extra-sesion glass" hidden></div>
        <button id="btn-volver-inicio" class="btn-principal" aria-label="Volver al inicio">Volver al inicio</button>
      </div>
    </section>

    <!-- ═══════════════ PANTALLA: PROGRESO ═══════════════ -->
    <section id="pantalla-progreso" class="pantalla" hidden>
      <div class="contenedor contenedor-ancho">
        <h2>📊 Mi Progreso</h2>
        <div id="progreso-stats" class="stats-cards"></div>
        <div id="mapa-calor" class="mapa-calor"></div>
        <div id="leyenda-mapa" class="leyenda"></div>
        <div id="medallas-todas" class="medallas-showcase"></div>
        <div id="ritmo-wrapper" class="opcion-ritmo glass"></div>
        <div id="opcion-ext-wrapper" class="opcion-extendidas glass"></div>
        <div class="botones-progreso">
          <button id="btn-exportar" class="btn-secundario" aria-label="Exportar progreso">📥 Exportar</button>
        </div>
        <button id="btn-volver-progreso" class="btn-secundario" aria-label="Volver al inicio">← Volver</button>
      </div>
    </section>

  </main>

  <!-- ═══════════════ AJUSTES (barra lateral) ═══════════════ -->
  <button id="btn-ajustes" class="btn-flotante btn-ajustes" aria-label="Abrir ajustes" aria-expanded="false"
    aria-controls="panel-ajustes">⚙️</button>

  <div id="panel-ajustes" class="panel-lateral panel-ajustes" aria-hidden="true" role="dialog"
    aria-label="Ajustes">
    <div class="panel-cabecera">
      <h4>⚙️ Ajustes</h4>
      <button class="panel-cerrar" data-cerrar="panel-ajustes" aria-label="Cerrar ajustes">✕</button>
    </div>
    <div class="panel-cuerpo">
      <div class="ajuste-fila">
        <span class="ajuste-label">🔊 Sonido</span>
        <button id="toggle-sonido" class="toggle-switch" role="switch" aria-checked="true"
          aria-label="Activar o desactivar el sonido"></button>
      </div>
      <div class="ajuste-fila ajuste-columna">
        <span class="ajuste-label">🎨 Tema</span>
        <div class="selector-tema" role="radiogroup" aria-label="Tema de la interfaz">
          <button class="tema-opcion" data-tema="light" role="radio" aria-checked="false">Claro</button>
          <button class="tema-opcion" data-tema="dark" role="radio" aria-checked="false">Oscuro</button>
          <button class="tema-opcion" data-tema="system" role="radio" aria-checked="true">Sistema</button>
        </div>
      </div>
      <button id="btn-ver-guia" class="btn-guia" aria-label="Ver la guía de uso"></button>
    </div>
  </div>

  <!-- ═══════════════ DEBUG (solo con ?debug=1) ═══════════════ -->
  <button id="debug-tab" class="btn-flotante debug-tab" hidden aria-label="Abrir panel de debug"
    aria-expanded="false" aria-controls="debug-panel">🛠️</button>
  <div id="debug-panel" class="panel-lateral debug-panel" aria-hidden="true" role="dialog" aria-label="Debug">
    <div class="panel-cabecera">
      <h4>🛠️ Debug</h4>
      <button class="panel-cerrar" data-cerrar="debug-panel" aria-label="Cerrar debug">✕</button>
    </div>
    <div class="panel-cuerpo">
      <p id="debug-tiempo"></p>
      <button id="debug-avanzar" class="btn-debug">⏩ +1 día</button>
      <button id="debug-reset" class="btn-debug">🗑️ Reset perfil</button>
      <button id="debug-consola" class="btn-debug">📋 Estado → consola</button>
    </div>
  </div>

  <div id="panel-overlay" class="panel-overlay" hidden></div>

  <!-- ═══════════════ GUÍA DE BIENVENIDA ═══════════════ -->
  <div id="bienvenida-overlay" class="modal-overlay" hidden>
    <div class="modal modal-guia" role="dialog" aria-modal="true" aria-labelledby="guia-titulo">
      <h3 id="guia-titulo"></h3>
      <div class="guia-tabs" role="tablist" aria-label="Guía de uso"></div>
      <div id="guia-contenido" class="guia-contenido" role="tabpanel" tabindex="0"></div>
      <label class="guia-check">
        <input type="checkbox" id="guia-no-mostrar">
        <span id="guia-no-mostrar-label"></span>
      </label>
      <div class="modal-botones">
        <button class="btn-principal" id="guia-cerrar"></button>
      </div>
    </div>
  </div>

  <!-- ═══════════════ MODAL ═══════════════ -->
  <div id="modal-overlay" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div id="modal-contenido"></div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>

</html>
